# PostgreSQL configuration

default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: job_board_pro_development
  username: job_board_pro
  password: <%= ENV["JOB_BOARD_PRO_DATABASE_PASSWORD"] %>
  host: localhost
  port: 5432

test:
  <<: *default
  database: job_board_pro_test
  username: job_board_pro
  password: <%= ENV["JOB_BOARD_PRO_DATABASE_PASSWORD"] %>
  host: localhost
  port: 5432

production:
  primary: &primary_production
    <<: *default
    database: job_board_pro_production
    username: job_board_pro
    password: <%= ENV["JOB_BOARD_PRO_DATABASE_PASSWORD"] %>
    host: localhost
    port: 5432

  cache:
    <<: *primary_production
    database: job_board_pro_production_cache
    migrations_paths: db/cache_migrate

  queue:
    <<: *primary_production
    database: job_board_pro_production_queue
    migrations_paths: db/queue_migrate

  cable:
    <<: *primary_production
    database: job_board_pro_production_cable
    migrations_paths: db/cable_migrate